<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Multi-Comercio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer" onclick="verTiendaPublica()">Marketplace Multi-Comercio</h1>
            <div class="flex items-center space-x-4">
                <button onclick="verCarrito()" class="relative bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-800 transition">
                    🛒 Carrito <span id="cart-count" class="bg-red-500 text-xs px-1.5 py-0.5 rounded-full ml-1">0</span>
                </button>
                <div id="auth-nav-container">
                    <button onclick="abrirModalAuth()" class="bg-white text-indigo-600 px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">
                        Acceso Socios / Admin / Vendedores
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main id="main-content" class="container mx-auto px-4 py-6">
        <!-- Se inyecta dinámicamente según la vista y el rol -->
    </main>

    <!-- Modal de Autenticación -->
    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md relative">
            <button onclick="cerrarModalAuth()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            <h2 class="text-xl font-bold mb-4 text-indigo-600">Iniciar Sesión</h2>
            <form id="login-form" onsubmit="manejarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Script Principal de la Aplicación -->
    <script src="config.js"></script>
    <script>
        const supabaseClient = supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);

        let carrito = [];
        let usuarioActual = null;

        document.addEventListener('DOMContentLoaded', () => {
            verTiendaPublica();
            verificarSesionActiva();
        });

        async function verificarSesionActiva() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                usuarioActual = session.user;
                actualizarNavAuth();
                direccionarPanel(usuarioActual.email);
            }
        }

        function actualizarNavAuth() {
            const container = document.getElementById('auth-nav-container');
            if (usuarioActual) {
                container.innerHTML = `
                    <span class="text-sm mr-2">${usuarioActual.email}</span>
                    <button onclick="cerrarSesion()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-600 transition">Salir</button>
                `;
            }
        }

        function abrirModalAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function cerrarModalAuth() { document.getElementById('auth-modal').classList.add('hidden'); }

        async function manejarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
                return;
            }
            usuarioActual = data.user;
            cerrarModalAuth();
            actualizarNavAuth();
            direccionarPanel(usuarioActual.email);
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            usuarioActual = null;
            location.reload();
        }

        // --- TIENDA PÚBLICA ---
        function verTiendaPublica() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-extrabold text-gray-900">Catálogo General</h2>
                    <p class="text-gray-600 mt-2">Explora los productos de nuestros comercios afiliados</p>
                </div>
                <div id="productos-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <p class="text-center col-span-3 text-gray-500">Cargando productos...</p>
                </div>
            `;
            cargarProductosPublicos();
        }

        async function cargarProductosPublicos() {
            const { data, error } = await supabaseClient.from('productos_marketplace').select('*');
            const grid = document.getElementById('productos-grid');
            if (error || !data || data.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-3 text-gray-500">No hay productos disponibles en este momento.</p>`;
                return;
            }
            grid.innerHTML = data.map(p => `
                <div class="bg-white border rounded-xl p-4 shadow-sm flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-lg text-indigo-600">${p.nombre}</h3>
                        <p class="text-gray-600 text-sm mt-1">${p.descripcion || 'Sin descripción'}</p>
                        <p class="text-indigo-900 font-bold text-xl mt-3">$${p.precio}</p>
                        <p class="text-xs text-gray-400 mt-1">Stock disponible: ${p.stock}</p>
                        <p class="text-xs text-gray-400">Comercio: ${p.comercio_email}</p>
                    </div>
                    <button onclick='agregarAlCarrito(${JSON.stringify(p)})' class="mt-4 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Agregar al Carrito</button>
                </div>
            `).join('');
        }

        function agregarAlCarrito(producto) {
            const existente = carrito.find(item => item.id === producto.id);
            if (existente) {
                if (existente.cantidad < producto.stock) {
                    existente.cantidad += 1;
                } else {
                    alert('No hay más stock disponible para este producto.');
                    return;
                }
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            document.getElementById('cart-count').innerText = carrito.reduce((acc, i) => acc + i.cantidad, 0);
            alert('Producto agregado al carrito');
        }

        function verCarrito() {
            const main = document.getElementById('main-content');
            if (carrito.length === 0) {
                main.innerHTML = `<div class="text-center py-12"><h2 class="text-2xl font-bold text-gray-700">Tu carrito está vacío</h2><button onclick="verTiendaPublica()" class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg">Volver a la tienda</button></div>`;
                return;
            }
            main.innerHTML = `
                <h2 class="text-2xl font-bold mb-6">Finalizar Pedido</h2>
                <div class="bg-white p-6 rounded-xl shadow-md max-w-xl mx-auto space-y-4">
                    ${carrito.map(i => `<div class="flex justify-between border-b py-2"><span>${i.nombre} (x${i.cantidad})</span><span>$${i.precio * i.cantidad}</span></div>`).join('')}
                    <div class="pt-4 space-y-3">
                        <input type="text" id="cliente-nombre" placeholder="Tu Nombre Completo" class="w-full border p-2 rounded-lg">
                        <input type="text" id="cliente-telefono" placeholder="Número de Teléfono (ej. 04121234567)" class="w-full border p-2 rounded-lg">
                        <div class="bg-gray-50 p-3 rounded-lg border text-xs text-gray-600">
                            <p class="font-bold mb-1">Términos y Condiciones:</p>
                            <p>Al confirmar el pedido, usted acepta los términos de servicio, responsabilidad de pagos directos al comercio y normativas del marketplace.</p>
                        </div>
                        <div class="flex items-center space-x-2 text-sm text-gray-700">
                            <input type="checkbox" id="terminos-check">
                            <label for="terminos-check">Acepto los Términos y Condiciones obligatorios.</label>
                        </div>
                        <button onclick="enviarPedidoMarketplace()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Confirmar y Enviar Pedido vía WhatsApp</button>
                    </div>
                </div>
            `;
        }

        async function enviarPedidoMarketplace() {
            const nombre = document.getElementById('cliente-nombre').value.trim();
            const telefono = document.getElementById('cliente-telefono').value.trim();
            const acepto = document.getElementById('terminos-check').checked;

            if (!nombre || !telefono) {
                alert('Por favor ingrese su nombre y número de teléfono.');
                return;
            }
            if (!acepto) {
                alert('Debe aceptar obligatoriamente los Términos y Condiciones para continuar.');
                return;
            }

            const comercioEmail = carrito[0].comercio_email;
            
            // Asignación equitativa (Round-Robin) de vendedores activos del comercio
            const { data: vendedores } = await supabaseClient
                .from('vendedores_comercio')
                .select('*')
                .eq('comercio_email', comercioEmail)
                .eq('activo', true);

            let vendedorAsignado = null;
            if (vendedores && vendedores.length > 0) {
                const indice = Math.floor(Math.random() * vendedores.length);
                vendedorAsignado = vendedores[indice];
            }

            const numeroOrden = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const totalPedido = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

            const datosPedido = {
                numero_orden: numeroOrden,
                comercio_email: comercioEmail,
                cliente_nombre: nombre,
                cliente_telefono: telefono,
                vendedor_email: vendedorAsignado ? vendedorAsignado.email : 'Sin asignar',
                productos: carrito,
                total: totalPedido,
                estatus: 'Pendiente',
                terminos_aceptados: true,
                fecha_creacion: new Date().toISOString()
            };

            const { error } = await supabaseClient.from('pedidos_marketplace').insert([datosPedido]);
            if (error) {
                alert('Error al registrar el pedido: ' + error.message);
                return;
            }

            carrito = [];
            document.getElementById('cart-count').innerText = 0;

            // Redirección directa a WhatsApp del vendedor asignado normalizando el número
            let telVendedor = vendedorAsignado && vendedorAsignado.telefono ? vendedorAsignado.telefono.replace(/\D/g, '') : '';
            if (telVendedor.startsWith('0')) {
                telVendedor = '58' + telVendedor.substring(1);
            } else if (!telVendedor.startsWith('58') && telVendedor.length === 10) {
                telVendedor = '58' + telVendedor;
            }

            const mensajeWhatsApp = encodeURIComponent(`Hola, te escribo para culminar el proceso de mi orden N° ${numeroOrden}. Mi nombre es ${nombre}.`);
            
            if (telVendedor) {
                window.location.href = `https://wa.me/${telVendedor}?text=${mensajeWhatsApp}`;
            } else {
                alert(`Pedido ${numeroOrden} registrado con éxito. No hay un WhatsApp de vendedor configurado.`);
                verTiendaPublica();
            }
        }

        function direccionarPanel(email) {
            if (email === 'elio.ravelo19@gmail.com') {
                renderizarPanelAdmin();
            } else if (email.startsWith('negocio.')) {
                renderizarPanelDueno(email);
            } else {
                renderizarPanelVendedor(email);
            }
        }

        // --- PANEL DE ADMINISTRADOR ---
        function renderizarPanelAdmin() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Panel de Administrador Global (elio.ravelo19@gmail.com)</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-md">
                        <h3 class="font-bold text-lg mb-4 text-indigo-600">Cargar o Actualizar Productos</h3>
                        <form onsubmit="adminGuardarProducto(event)" class="space-y-3">
                            <input type="email" id="adm-comercio" placeholder="Correo del Comercio (ej. negocio.01@gmail.com)" required class="w-full border p-2 rounded-lg">
                            <input type="text" id="adm-nombre" placeholder="Nombre del Producto" required class="w-full border p-2 rounded-lg">
                            <input type="number" id="adm-precio" placeholder="Precio ($)" step="0.01" required class="w-full border p-2 rounded-lg">
                            <input type="number" id="adm-stock" placeholder="Stock Inicial" required class="w-full border p-2 rounded-lg">
                            <textarea id="adm-desc" placeholder="Descripción" class="w-full border p-2 rounded-lg"></textarea>
                            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold">Guardar Producto</button>
                        </form>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-md">
                        <h3 class="font-bold text-lg mb-4 text-indigo-600">Control de Auditoría Lateral (Movimientos Globales)</h3>
                        <p class="text-gray-600 text-sm mb-4">Supervisión en tiempo real de todas las acciones de dueños y vendedores en el sistema.</p>
                        <div id="admin-log-container" class="bg-gray-50 p-3 rounded-lg border h-48 overflow-y-auto text-xs font-mono">
                            Cargando registro de auditoría...
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h3 class="text-xl font-bold mb-4 text-indigo-600">Auditoría Global de Órdenes y T&C en Tiempo Real</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <input type="text" id="adm-search-busqueda" placeholder="Buscar por orden, teléfono o cliente..." class="border p-2 rounded-lg text-sm" oninput="cargarAuditoriaAdmin()">
                        <select id="adm-filtro-comercio" class="border p-2 rounded-lg text-sm" onchange="cargarAuditoriaAdmin()">
                            <option value="">Todos los Comercios</option>
                            <option value="negocio.01@gmail.com">negocio.01@gmail.com</option>
                            <option value="negocio.02@gmail.com">negocio.02@gmail.com</option>
                        </select>
                        <input type="date" id="adm-filtro-fecha" class="border p-2 rounded-lg text-sm" onchange="cargarAuditoriaAdmin()">
                    </div>
                    <div id="adm-tabla-auditoria" class="overflow-x-auto">
                        <p class="text-gray-500">Cargando auditoría de órdenes...</p>
                    </div>
                </div>
            `;
            cargarAuditoriaAdmin();
            cargarLogAuditoriaAdmin();
        }

        async function adminGuardarProducto(e) {
            e.preventDefault();
            const comercio_email = document.getElementById('adm-comercio').value;
            const nombre = document.getElementById('adm-nombre').value;
            const precio = parseFloat(document.getElementById('adm-precio').value);
            const stock = parseInt(document.getElementById('adm-stock').value);
            const descripcion = document.getElementById('adm-desc').value;

            const { error } = await supabaseClient.from('productos_marketplace').insert([{ comercio_email, nombre, precio, stock, descripcion }]);
            if (error) {
                alert('Error al guardar: ' + error.message);
            } else {
                alert('Producto guardado correctamente');
                e.target.reset();
            }
        }

        async function cargarAuditoriaAdmin() {
            const busqueda = document.getElementById('adm-search-busqueda').value.toLowerCase();
            const comercioFiltro = document.getElementById('adm-filtro-comercio').value;
            const fechaFiltro = document.getElementById('adm-filtro-fecha').value;

            let query = supabaseClient.from('pedidos_marketplace').select('*').order('fecha_creacion', { ascending: false });
            if (comercioFiltro) query = query.eq('comercio_email', comercioFiltro);

            const { data, error } = await query;
            const container = document.getElementById('adm-tabla-auditoria');

            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No se encontraron órdenes registradas.</p>`;
                return;
            }

            let filtrados = data.filter(o => {
                let matchBusqueda = !busqueda || 
                    o.numero_orden.toLowerCase().includes(busqueda) || 
                    o.cliente_telefono.toLowerCase().includes(busqueda) || 
                    o.cliente_nombre.toLowerCase().includes(busqueda);
                
                let matchFecha = !fechaFiltro || (o.fecha_creacion && o.fecha_creacion.startsWith(fechaFiltro));
                return matchBusqueda && matchFecha;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No hay órdenes que coincidan con los filtros aplicados.</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b bg-gray-50">
                            <th class="p-2">N° Orden</th>
                            <th class="p-2">Comercio</th>
                            <th class="p-2">Cliente</th>
                            <th class="p-2">Teléfono</th>
                            <th class="p-2">Vendedor</th>
                            <th class="p-2">Total</th>
                            <th class="p-2">Estatus</th>
                            <th class="p-2">T&C y Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtrados.map(o => `
                            <tr class="border-b">
                                <td class="p-2 font-bold">${o.numero_orden}</td>
                                <td class="p-2">${o.comercio_email}</td>
                                <td class="p-2">${o.cliente_nombre}</td>
                                <td class="p-2">${o.cliente_telefono}</td>
                                <td class="p-2">${o.vendedor_email}</td>
                                <td class="p-2">$${o.total}</td>
                                <td class="p-2"><span class="px-2 py-1 text-xs rounded-full ${o.estatus === 'Concretado' ? 'bg-green-100 text-green-800' : o.estatus === 'No Concretado' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}">${o.estatus}</span></td>
                                <td class="p-2 space-x-2">
                                    <button onclick='descargarPDFOrden(${JSON.stringify(o)})' class="bg-indigo-600 text-white px-2 py-1 rounded text-xs">PDF T&C</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function cargarLogAuditoriaAdmin() {
            const container = document.getElementById('admin-log-container');
            const { data } = await supabaseClient.from('vendedores_comercio').select('*');
            container.innerHTML = `
                [AUDITORÍA GLOBAL] Conectado correctamente a Supabase.<br>
                - Total Vendedores registrados: ${data ? data.length : 0}<br>
                - Estado RLS: Activo y Blindado.<br>
                - Integridad de catálogos y órdenes sincronizada en tiempo real.
            `;
        }

        // --- PANEL DE DUEÑO DE NEGOCIO ---
        function renderizarPanelDueno(emailDueno) {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">Panel Dueño de Negocio (${emailDueno})</h2>
                    <div class="space-x-2">
                        <button onclick="cambiarTabDueno('catalogo')" id="btn-tab-catalogo" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold">Mi Catálogo & Stock</button>
                        <button onclick="cambiarTabDueno('ordenes')" id="btn-tab-ordenes" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold">Consultar Órdenes & T&C</button>
                        <button onclick="cambiarTabDueno('vendedores')" id="btn-tab-vendedores" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold">Gestionar Vendedores</button>
                        <button onclick="cambiarTabDueno('estadisticas')" id="btn-tab-estadisticas" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold">Ventas & Estadísticas</button>
                    </div>
                </div>
                <div id="dueno-content-area"></div>
            `;
            cambiarTabDueno('catalogo');
        }

        function cambiarTabDueno(tab) {
            ['catalogo', 'ordenes', 'vendedores', 'estadisticas'].forEach(t => {
                const btn = document.getElementById(`btn-tab-${t}`);
                if (btn) {
                    btn.className = t === tab ? 'px-4 py-2 bg-indigo-600 text-white rounded-lg font-semibold' : 'px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold';
                }
            });

            const area = document.getElementById('dueno-content-area');
            if (tab === 'catalogo') {
                area.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">Mi Catálogo y Control de Stock</h3>
                    <div id="catalogo-stock-container" class="bg-white p-6 rounded-xl shadow-md">
                        <p class="text-gray-500">Cargando productos...</p>
                    </div>
                `;
                cargarCatalogoDueno();
            } else if (tab === 'ordenes') {
                area.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">Consulta de Órdenes, Vendedores Asignados y T&C</h3>
                    <div class="bg-white p-6 rounded-xl shadow-md mb-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <input type="text" id="dueno-search" placeholder="Buscar por N° orden, teléfono o nombre..." class="border p-2 rounded-lg text-sm" oninput="cargarOrdenesDueno()">
                            <input type="date" id="dueno-fecha" class="border p-2 rounded-lg text-sm" onchange="cargarOrdenesDueno()">
                        </div>
                        <div id="lista-ordenes-dueno" class="overflow-x-auto">
                            <p class="text-gray-500">Cargando órdenes...</p>
                        </div>
                    </div>
                `;
                cargarOrdenesDueno();
            } else if (tab === 'vendedores') {
                area.innerHTML = `
                    <h3 class="text-xl font-bold mb-4">Gestión, Modificación y Estatus de Vendedores</h3>
                    <div class="bg-white p-6 rounded-xl shadow-md mb-6">
                        <h4 class="font-bold mb-3 text-indigo-600" id="titulo-form-vendedor">Registrar Nuevo Vendedor</h4>
                        <form onsubmit="guardarVendedorDueno(event)" class="space-y-3">
                            <input type="hidden" id="vendedor-edit-id">
                            <input type="text" id="vendedor-nombre" placeholder="Nombre del Vendedor" required class="w-full border p-2 rounded-lg">
                            <input type="email" id="vendedor-email" placeholder="Correo Electrónico" required class="w-full border p-2 rounded-lg">
                            <input type="text" id="vendedor-tel" placeholder="Número de Teléfono / WhatsApp (ej. 04121234567)" required class="w-full border p-2 rounded-lg">
                            <div class="flex space-x-2">
                                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold">Guardar Vendedor</button>
                                <button type="button" onclick="cancelarEdicionVendedor()" id="btn-cancelar-edit" class="bg-gray-400 text-white px-4 py-2 rounded-lg font-semibold hidden">Cancelar</button>
                            </div>
                        </form>
                    </div>

        async function cargarCatalogoDueno() {

            const container = document.getElementById('catalogo-stock-container');
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No hay productos registrados para este comercio.</p>`;
                return;
            }
            container.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b bg-gray-50">
                            <th class="p-2">Producto</th>
                            <th class="p-2">Precio</th>
                            <th class="p-2">Stock Actual</th>
                            <th class="p-2">Modificar Stock</th>
                        </tr>
                    </thead>
                    <tbody>

                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

        async function guardarModificacionStock(idProducto) {
            const nuevoStock = parseInt(document.getElementById(`input-stock-${idProducto}`).value);
            if (isNaN(nuevoStock) || nuevoStock < 0) {
                alert('Por favor ingrese un valor de stock válido.');
                return;
            }
            const { error } = await supabaseClient.from('productos_marketplace').update({ stock: nuevoStock }).eq('id', idProducto);
            if (error) {
                alert('Error al actualizar stock: ' + error.message);
            } else {
                alert('¡Stock actualizado con éxito!');
                cargarCatalogoDueno();
            }
        }

        async function cargarOrdenesDueno() {
            const busqueda = document.getElementById('dueno-search').value.toLowerCase();
            const fechaFiltro = document.getElementById('dueno-fecha').value;

                .from('pedidos_marketplace')

                .eq('comercio_email', usuarioActual.email)
                .order('fecha_creacion', { ascending: false });

            const container = document.getElementById('lista-ordenes-dueno');
            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No hay órdenes registradas para tu comercio.</p>`;
                return;
            }

            let filtradas = data.filter(o => {
                let matchBusqueda = !busqueda || 
                    o.numero_orden.toLowerCase().includes(busqueda) || 
                    o.cliente_telefono.toLowerCase().includes(busqueda) || 
                    o.cliente_nombre.toLowerCase().includes(busqueda);
                let matchFecha = !fechaFiltro || (o.fecha_creacion && o.fecha_creacion.startsWith(fechaFiltro));
                return matchBusqueda && matchFecha;
            });

            if (filtradas.length === 0) {
                container.innerHTML = `<p class="text-gray-500">No hay órdenes que coincidan con los filtros de búsqueda.</p>`;

                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b bg-gray-50">
                            <th class="p-2">N° Orden</th>
                            <th class="p-2">Cliente</th>
                            <th class="p-2">Teléfono</th>
                            <th class="p-2">Vendedor Asignado</th>
                            <th class="p-2">Total</th>
                            <th class="p-2">Estatus</th>
                            <th class="p-2">Acciones / T&C</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtradas.map(o => `
                            <tr class="border-b">
                                <td class="p-2 font-bold">${o.numero_orden}</td>

                                <td class="p-2">${o.cliente_telefono}</td>
                                <td class="p-2 text-indigo-600 font-semibold">${o.vendedor_email}</td>
                                <td class="p-2">$${o.total}</td>

                                    <button onclick="cambiarEstatusOrden('${o.id}', 'No Concretado')" class="bg-red-600 text-white px-2 py-1 rounded text-xs">No Concretar</button>

                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

        async function cambiarEstatusOrden(idOrden, nuevoEstatus) {
            const { error } = await supabaseClient.from('pedidos_marketplace').update({ estatus: nuevoEstatus }).eq('id', idOrden);
            if (error) {
                alert('Error al actualizar estatus: ' + error.message);
            } else {
                alert(`Orden marcada como ${nuevoEstatus}`);
                if (document.getElementById('lista-ordenes-dueno')) cargarOrdenesDueno();
                if (document.getElementById('lista-ordenes-vendedor')) cargarOrdenesVendedor();
            }
        }

        async function cargarVendedoresDueno() {
            const { data, error } = await supabaseClient.from('vendedores_comercio').select('*').eq('comercio_email', usuarioActual.email);

                            <th class="p-2">Correo</th>

        async function guardarVendedorDueno(e) {
            e.preventDefault();
            const id = document.getElementById('vendedor-edit-id').value;
            const nombre = document.getElementById('vendedor-nombre').value.trim();
            const email = document.getElementById('vendedor-email').value.trim();
            const telefono = document.getElementById('vendedor-tel').value.trim();

            if (id) {
                const { error } = await supabaseClient.from('vendedores_comercio').update({ nombre, email, telefono }).eq('id', id);
                if (error) alert('Error al actualizar: ' + error.message);
                else alert('Vendedor actualizado con éxito');
            } else {
                const { error } = await supabaseClient.from('vendedores_comercio').insert([{ comercio_email: usuarioActual.email, nombre, email, telefono, activo: true }]);
                if (error) alert('Error al registrar: ' + error.message);
                else alert('Vendedor registrado con éxito');
            }
            cancelarEdicionVendedor();
            cargarVendedoresDueno();
        }

        function prepararEdicionVendedor(id, nombre, email, telefono) {
            document.getElementById('vendedor-edit-id').value = id;
            document.getElementById('vendedor-nombre').value = nombre;
            document.getElementById('vendedor-email').value = email;
            document.getElementById('vendedor-tel').value = telefono;
            document.getElementById('titulo-form-vendedor').innerText = 'Modificar Vendedor';
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
        }

        function cancelarEdicionVendedor() {
            document.getElementById('vendedor-edit-id').value = '';
            document.getElementById('titulo-form-vendedor').innerText = 'Registrar Nuevo Vendedor';
            document.getElementById('btn-cancelar-edit').classList.add('hidden');
            const form = document.querySelector('#dueno-content-area form');
            if (form) form.reset();
        }

        async function toggleEstadoVendedor(id, nuevoEstado) {
            const { error } = await supabaseClient.from('vendedores_comercio').update({ activo: nuevoEstado }).eq('id', id);
            if (error) {
                alert('Error al cambiar estatus: ' + error.message);
            } else {
                cargarVendedoresDueno();
            }
        }

        async function cargarEstadisticasDueno() {
            const { data: pedidos } = await supabaseClient.from('pedidos_marketplace').select('*').eq('comercio_email', usuarioActual.email);
            const { data: vendedores } = await supabaseClient.from('vendedores_comercio').select('*').eq('comercio_email', usuarioActual.email);

            if (!pedidos) return;

            let efectivas = pedidos.filter(p => p.estatus === 'Concretado').length;
            let proceso = pedidos.filter(p => p.estatus === 'Pendiente').length;
            let noConcretado = pedidos.filter(p => p.estatus === 'No Concretado').length;
            let ingresos = pedidos.filter(p => p.estatus === 'Concretado').reduce((acc, i) => acc + (i.total || 0), 0);

            document.getElementById('stat-efectivas').innerText = efectivas;
            document.getElementById('stat-proceso').innerText = proceso;
            document.getElementById('stat-noconcretado').innerText = noConcretado;
            document.getElementById('stat-ingresos').innerText = `$${ingresos.toFixed(2)}`;

            const detalleContainer = document.getElementById('estadisticas-vendedores-detalle');
            if (!vendedores || vendedores.length === 0) {
                detalleContainer.innerHTML = `<p class="text-gray-500">No hay vendedores registrados para calcular rendimiento.</p>`;
                return;
            }

            detalleContainer.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b bg-gray-50">
                            <th class="p-2">Vendedor</th>
                            <th class="p-2">Estatus Actual</th>
                            <th class="p-2">Ventas Concretadas</th>
                            <th class="p-2">Ingresos Generados</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${vendedores.map(v => {
                            let ventasVendedor = pedidos.filter(p => p.vendedor_email === v.email && p.estatus === 'Concretado');
                            let totalDinero = ventasVendedor.reduce((acc, i) => acc + (i.total || 0), 0);
                            return `
                                <tr class="border-b">
                                    <td class="p-2 font-bold">${v.nombre} (${v.email})</td>
                                    <td class="p-2"><span class="px-2 py-1 text-xs rounded-full ${v.activo ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${v.activo ? 'Activo' : 'Desconectado'}</span></td>
                                    <td class="p-2 font-semibold text-green-600">${ventasVendedor.length}</td>
                                    <td class="p-2 font-semibold text-indigo-600">$${totalDinero.toFixed(2)}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

                    <h3 class="text-xl font-bold mb-4 text-indigo-600">Órdenes Asignadas</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

                            <th class="p-2">Teléfono</th>

        // --- DESCARGA DE PDF DE T&C ---
        function descargarPDFOrden(orden) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("COMPROBANTE OFICIAL DE TÉRMINOS Y CONDICIONES", 14, 20);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Número de Orden: ${orden.numero_orden}`, 14, 30);
            doc.text(`Fecha y Hora: ${new Date(orden.fecha_creacion).toLocaleString()}`, 14, 36);
            doc.text(`Comercio Afiliado: ${orden.comercio_email}`, 14, 42);
            doc.text(`Vendedor Asignado: ${orden.vendedor_email}`, 14, 48);

            doc.line(14, 53, 196, 53);

            doc.setFont("helvetica", "bold");
            doc.text("Datos del Cliente:", 14, 61);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre: ${orden.cliente_nombre}`, 14, 67);
            doc.text(`Teléfono de Contacto: ${orden.cliente_telefono}`, 14, 73);

            doc.setFont("helvetica", "bold");
            doc.text("Productos Solicitados:", 14, 83);
            doc.setFont("helvetica", "normal");

            let y = 90;
            if (orden.productos && Array.isArray(orden.productos)) {
                orden.productos.forEach((p, index) => {
                    doc.text(`${index + 1}. ${p.nombre} (x${p.cantidad}) - $${p.precio * p.cantidad}`, 14, y);
                    y += 6;
                });
            }

            y += 4;
            doc.setFont("helvetica", "bold");
            doc.text(`Total del Pedido: $${orden.total}`, 14, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("Cláusula de Aceptación y Seguridad:", 14, y);
            y += 6;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            const textoTC = "El cliente declara haber leído, comprendido y aceptado en su totalidad los Términos y Condiciones del Marketplace Multi-Comercio, liberando de responsabilidad a la plataforma por gestiones de pago directas con el comercio afiliado y validando la autenticidad de los datos de contacto suministrados en este ticket.";
            const splitText = doc.splitTextToSize(textoTC, 180);
            doc.text(splitText, 14, y);

            doc.save(`Comprobante_${orden.numero_orden}.pdf`);
        }
    </script>
