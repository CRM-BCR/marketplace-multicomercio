<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Multi-Comercio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer tracking-wide text-indigo-400" onclick="verTiendaPublica()">Marketplace Multi-Comercio</h1>
            <div class="flex items-center space-x-4">
                <button onclick="verCarrito()" class="relative bg-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-500 transition">
                    🛒 Carrito <span id="cart-count" class="bg-rose-500 text-xs px-1.5 py-0.5 rounded-full ml-1 font-bold">0</span>
                </button>
                <div id="auth-nav-container">
                    <button onclick="abrirModalAuth()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-indigo-500 transition shadow-sm">
                        Acceso Socios / Admin / Vendedores
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main id="main-content" class="container mx-auto px-4 py-6">
        <!-- Se inyecta dinámicamente -->
    </main>

    <!-- Modal de Autenticación -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative border border-slate-100">
            <button onclick="cerrarModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            <h2 class="text-xl font-bold mb-4 text-slate-900">Iniciar Sesión en el Sistema</h2>
            <form id="login-form" onsubmit="manejarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="ej. elio.ravelo19@gmail.com" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-md shadow-indigo-100">Entrar al Panel</button>
            </form>
        </div>
    </div>

    <!-- Script de Configuración y Lógica -->
    <script src="config.js"></script>
    <script>
        const supabaseClient = supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);

        let carrito = [];
        let usuarioActual = null;

        document.addEventListener('DOMContentLoaded', () => {
            verTiendaPublica();
            verificarSesionActiva();
        });

        async function verificarSesionActiva() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                usuarioActual = session.user;
                actualizarNavAuth();
                direccionarPanel(usuarioActual.email);
            }
        }

        function actualizarNavAuth() {
            const container = document.getElementById('auth-nav-container');
            if (usuarioActual) {
                container.innerHTML = `
                    <span class="text-sm mr-2 font-medium text-slate-300">${usuarioActual.email}</span>
                    <button onclick="cerrarSesion()" class="bg-rose-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-rose-500 transition shadow-sm">Salir</button>
                `;
            }
        }

        function abrirModalAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function cerrarModalAuth() { document.getElementById('auth-modal').classList.add('hidden'); }

        async function manejarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                usuarioActual = { email: email };
            } else {
                usuarioActual = data.user;
            }
            cerrarModalAuth();
            actualizarNavAuth();
            direccionarPanel(usuarioActual.email);
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            usuarioActual = null;
            location.reload();
        }

        // --- TIENDA PÚBLICA ---
        function verTiendaPublica() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900">Catálogo General</h2>
                    <p class="text-slate-500 mt-2">Explora los productos de nuestros comercios afiliados</p>
                </div>
                <div id="productos-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <p class="text-center col-span-3 text-slate-400 py-8">Cargando productos...</p>
                </div>
            `;
            cargarProductosPublicos();
        }

        async function cargarProductosPublicos() {
            const { data, error } = await supabaseClient.from('productos_marketplace').select('*');
            const grid = document.getElementById('productos-grid');
            if (error || !data || data.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-3 text-slate-500 bg-white p-8 rounded-xl shadow-sm border border-slate-100">No hay productos disponibles en este momento.</p>`;
                return;
            }
            grid.innerHTML = data.map(p => `
                <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">${p.comercio_email || 'Comercio General'}</span>
                        <h3 class="font-bold text-lg text-slate-900 mt-3">${p.nombre}</h3>
                        <p class="text-slate-600 text-sm mt-1">${p.descripcion || 'Sin descripción disponible'}</p>
                        <p class="text-indigo-600 font-extrabold text-2xl mt-4">$${p.precio}</p>
                        <p class="text-xs text-slate-400 mt-1">Stock disponible: ${p.stock}</p>
                    </div>
                    <button onclick='agregarAlCarrito(${JSON.stringify(p)})' class="mt-5 w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-sm">Agregar al Carrito</button>
                </div>
            `).join('');
        }

        function agregarAlCarrito(producto) {
            const existente = carrito.find(item => item.id === producto.id);
            if (existente) {
                if (existente.cantidad < producto.stock) {
                    existente.cantidad += 1;
                } else {
                    alert('No hay más stock disponible para este producto.');
                    return;
                }
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            document.getElementById('cart-count').innerText = carrito.reduce((acc, i) => acc + i.cantidad, 0);
            alert('Producto agregado al carrito');
        }

        function verCarrito() {
            const main = document.getElementById('main-content');
            if (carrito.length === 0) {
                main.innerHTML = `<div class="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100"><h2 class="text-2xl font-bold text-slate-700">Tu carrito está vacío</h2><button onclick="verTiendaPublica()" class="mt-4 bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition">Volver a la tienda</button></div>`;
                return;
            }
            main.innerHTML = `
                <h2 class="text-2xl font-bold mb-6 text-slate-900">Finalizar Pedido</h2>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-xl mx-auto space-y-4">
                    ${carrito.map(i => `<div class="flex justify-between border-b border-slate-100 py-3 text-sm"><span>${i.nombre} (x${i.cantidad})</span><span class="font-semibold">$${i.precio * i.cantidad}</span></div>`).join('')}
                    <div class="pt-4 space-y-4">
                        <input type="text" id="cliente-nombre" placeholder="Tu Nombre Completo" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <input type="text" id="cliente-telefono" placeholder="Número de Teléfono (ej. 04121234567)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-1">
                            <p class="font-bold text-slate-700">Términos y Condiciones:</p>
                            <p>Al confirmar el pedido, usted acepta los términos de servicio y responsabilidad de pagos directos al comercio afiliado.</p>
                        </div>
                        <div class="flex items-center space-x-2 text-sm text-slate-700">
                            <input type="checkbox" id="terminos-check" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <label for="terminos-check">Acepto los Términos y Condiciones obligatorios.</label>
                        </div>
                        <button onclick="enviarPedidoMarketplace()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-sm">Confirmar y Enviar Pedido vía WhatsApp</button>
                    </div>
                </div>
            `;
        }

        async function enviarPedidoMarketplace() {
            const nombre = document.getElementById('cliente-nombre').value.trim();
            const telefono = document.getElementById('cliente-telefono').value.trim();
            const acepto = document.getElementById('terminos-check').checked;

            if (!nombre || !telefono) {
                alert('Por favor ingrese su nombre y número de teléfono.');
                return;
            }
            if (!acepto) {
                alert('Debe aceptar obligatoriamente los Términos y Condiciones para continuar.');
                return;
            }

            const comercioEmail = carrito[0].comercio_email || 'negocio.01@gmail.com';
            
            const { data: vendedores } = await supabaseClient
                .from('vendedores_comercio')
                .select('*')
                .eq('comercio_email', comercioEmail)
                .eq('activo', true);

            let vendedorAsignado = null;
            if (vendedores && vendedores.length > 0) {
                const indice = Math.floor(Math.random() * vendedores.length);
                vendedorAsignado = vendedores[indice];
            }

            const numeroOrden = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const totalPedido = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

            const datosPedido = {
                numero_orden: numeroOrden,
                comercio_email: comercioEmail,
                cliente_nombre: nombre,
                cliente_telefono: telefono,
                vendedor_email: vendedorAsignado ? vendedorAsignado.email : 'Sin asignar',
                productos: carrito,
                total: totalPedido,
                estatus: 'Pendiente',
                terminos_aceptados: true,
                fecha_creacion: new Date().toISOString()
            };

            await supabaseClient.from('pedidos_marketplace').insert([datosPedido]);

            // Formación del mensaje completo para WhatsApp con cantidades, detalle, nombre y total
            let textoMensaje = `Hola, te escribo para concretar mi orden N° ${numeroOrden}.\n\n` +
                `👤 *Cliente:* ${nombre}\n` +
                `📱 *Teléfono:* ${telefono}\n\n` +
                `🛒 *Detalle de Productos:*` +
                carrito.map(i => `\n• ${i.nombre} (Cantidad: ${i.cantidad}) - Subtotal: $${i.precio * i.cantidad}`).join('') +
                `\n\n💰 *Monto Total:* $${totalPedido.toFixed(2)}`;

            carrito = [];
            document.getElementById('cart-count').innerText = 0;

            let telVendedor = vendedorAsignado && vendedorAsignado.telefono ? vendedorAsignado.telefono.replace(/\D/g, '') : '';
            if (telVendedor.startsWith('0')) {
                telVendedor = '58' + telVendedor.substring(1);
            }

            const mensajeWhatsApp = encodeURIComponent(textoMensaje);
            
            if (telVendedor) {
                window.location.href = `https://wa.me/${telVendedor}?text=${mensajeWhatsApp}`;
            } else {
                alert(`Pedido ${numeroOrden} registrado con éxito.`);
                verTiendaPublica();
            }
        }

        function direccionarPanel(email) {
            if (email === 'elio.ravelo19@gmail.com') {
                renderizarPanelAdmin();
            } else if (email.startsWith('negocio.')) {
                renderizarPanelDueno(email);
            } else {
                renderizarPanelVendedor(email);
            }
        }

        // --- PANEL DE ADMINISTRADOR ---
        function renderizarPanelAdmin() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Panel de Administrador Global</h2>
                        <p class="text-slate-500 text-sm">Control central de productos y auditoría de órdenes</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-lg mb-4 text-indigo-600">Cargar Producto al Comercio</h3>
                        <form onsubmit="adminGuardarProducto(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700">Comercio Destino</label>
                                <select id="adm-comercio" required class="w-full mt-1 border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                    <option value="negocio.01@gmail.com">negocio.01@gmail.com</option>
                                    <option value="negocio.02@gmail.com">negocio.02@gmail.com</option>
                                </select>
                            </div>
                            <input type="text" id="adm-nombre" placeholder="Nombre del Producto" required class="w-full border border-slate-300 p-2.5 rounded-xl text-sm">
                            <input type="number" id="adm-precio" placeholder="Precio ($)" step="0.01" required class="w-full border border-slate-300 p-2.5 rounded-xl text-sm">
                            <input type="number" id="adm-stock" placeholder="Stock Inicial" required class="w-full border border-slate-300 p-2.5 rounded-xl text-sm">
                            <textarea id="adm-desc" placeholder="Descripción" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm"></textarea>
                            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-sm">Guardar Producto</button>
                        </form>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-lg mb-4 text-indigo-600">Auditoría Lateral del Sistema</h3>
                        <div id="admin-log-container" class="bg-slate-50 p-4 rounded-xl border border-slate-200 h-64 overflow-y-auto text-xs font-mono text-slate-700">
                            Cargando registros de auditoría...
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-xl font-bold mb-4 text-slate-900">Auditoría Global de Órdenes y T&C</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <input type="text" id="adm-search" placeholder="Buscar por orden, teléfono o cliente..." class="border border-slate-300 p-2.5 rounded-xl text-sm" oninput="cargarAuditoriaAdmin()">
                        <select id="adm-filtro-comercio" class="border border-slate-300 p-2.5 rounded-xl text-sm" onchange="cargarAuditoriaAdmin()">
                            <option value="">Todos los Comercios</option>
                            <option value="negocio.01@gmail.com">negocio.01@gmail.com</option>
                            <option value="negocio.02@gmail.com">negocio.02@gmail.com</option>
                        </select>
                        <input type="date" id="adm-filtro-fecha" class="border border-slate-300 p-2.5 rounded-xl text-sm" onchange="cargarAuditoriaAdmin()">
                    </div>
                    <div id="adm-tabla-auditoria" class="overflow-x-auto"><p class="text-slate-400">Cargando órdenes...</p></div>
                </div>
            `;
            cargarAuditoriaAdmin();
            cargarLogAuditoriaAdmin();
        }

        async function adminGuardarProducto(e) {
            e.preventDefault();
            const comercio_email = document.getElementById('adm-comercio').value;
            const nombre = document.getElementById('adm-nombre').value;
            const precio = parseFloat(document.getElementById('adm-precio').value);
            const stock = parseInt(document.getElementById('adm-stock').value);
            const descripcion = document.getElementById('adm-desc').value;

            const { error } = await supabaseClient.from('productos_marketplace').insert([{ comercio_email, nombre, precio, stock, descripcion }]);
            if (error) {
                alert('Error al guardar: ' + error.message);
            } else {
                alert('¡Producto guardado correctamente!');
                e.target.reset();
            }
        }

        async function cargarAuditoriaAdmin() {
            const busqueda = document.getElementById('adm-search').value.toLowerCase();
            const comercioFiltro = document.getElementById('adm-filtro-comercio').value;
            const fechaFiltro = document.getElementById('adm-filtro-fecha').value;

            let query = supabaseClient.from('pedidos_marketplace').select('*').order('fecha_creacion', { ascending: false });
            if (comercioFiltro) query = query.eq('comercio_email', comercioFiltro);

            const { data } = await query;
            const container = document.getElementById('adm-tabla-auditoria');
            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-slate-500">No hay órdenes registradas.</p>`;
                return;
            }

            let filtrados = data.filter(o => {
                let matchBusqueda = !busqueda || o.numero_orden.toLowerCase().includes(busqueda) || o.cliente_telefono.toLowerCase().includes(busqueda) || o.cliente_nombre.toLowerCase().includes(busqueda);
                let matchFecha = !fechaFiltro || (o.fecha_creacion && o.fecha_creacion.startsWith(fechaFiltro));
                return matchBusqueda && matchFecha;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<p class="text-slate-500">No hay órdenes que coincidan con los filtros.</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                            <th class="p-3">N° Orden</th>
                            <th class="p-3">Comercio</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Teléfono</th>
                            <th class="p-3">Vendedor</th>
                            <th class="p-3">Total</th>
                            <th class="p-3">Estatus</th>
                            <th class="p-3">Acciones T&C</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtrados.map(o => `
                            <tr class="border-b border-slate-100">
                                <td class="p-3 font-bold">${o.numero_orden}</td>
                                <td class="p-3">${o.comercio_email}</td>
                                <td class="p-3">${o.cliente_nombre}</td>
                                <td class="p-3">${o.cliente_telefono}</td>
                                <td class="p-3">${o.vendedor_email}</td>
                                <td class="p-3 font-semibold">$${o.total}</td>
                                <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full ${o.estatus === 'Concretado' ? 'bg-emerald-100 text-emerald-800' : o.estatus === 'No Concretado' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}">${o.estatus}</span></td>
                                <td class="p-3"><button onclick='descargarPDFOrden(${JSON.stringify(o)})' class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">PDF T&C</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function cargarLogAuditoriaAdmin() {
            const container = document.getElementById('admin-log-container');
            const { data } = await supabaseClient.from('vendedores_comercio').select('*');
            container.innerHTML = `
                [SISTEMA ACTIVO] Conexión establecida con Supabase.<br>
                - Total de Vendedores registrados: ${data ? data.length : 0}<br>
                - Seguridad RLS y Políticas configuradas.<br>
                - Sincronización de pedidos y T&C operando en tiempo real.
            `;
        }

        // --- PANEL DE DUEÑO DE NEGOCIO ---
        function renderizarPanelDueno(emailDueno) {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Panel Dueño (${emailDueno})</h2>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="cambiarTabDueno('catalogo')" id="btn-tab-catalogo" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold text-sm shadow-sm">Catálogo & Stock</button>
                        <button onclick="cambiarTabDueno('ordenes')" id="btn-tab-ordenes" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-semibold text-sm">Consultar Órdenes</button>
                        <button onclick="cambiarTabDueno('vendedores')" id="btn-tab-vendedores" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-semibold text-sm">Gestionar Vendedores</button>
                        <button onclick="cambiarTabDueno('estadisticas')" id="btn-tab-estadisticas" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-semibold text-sm">Ventas & Estadísticas</button>
                    </div>
                </div>
                <div id="dueno-content-area"></div>
            `;
            cambiarTabDueno('catalogo');
        }

        function cambiarTabDueno(tab) {
            ['catalogo', 'ordenes', 'vendedores', 'estadisticas'].forEach(t => {
                const btn = document.getElementById(`btn-tab-${t}`);
                if (btn) {
                    btn.className = t === tab ? 'px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold text-sm shadow-sm' : 'px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-semibold text-sm';
                }
            });

            const area = document.getElementById('dueno-content-area');
            if (tab === 'catalogo') {
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="text-xl font-bold mb-4 text-slate-900">Mi Catálogo y Control de Stock</h3>
                        <div id="catalogo-stock-container"><p class="text-slate-400">Cargando productos...</p></div>
                    </div>
                `;
                cargarCatalogoDueno();
            } else if (tab === 'ordenes') {
                area.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="text-xl font-bold mb-4 text-slate-900">Consultar Órdenes y T&C</h3>

                <div class="space-y-3">

            alert('Stock actualizado con éxito');

            if (confirm('¿Estás seguro de eliminar este producto?')) {
                await supabaseClient.from('productos_marketplace').delete().eq('id', id);
                cargarCatalogoDueno();
            }

                return matchBusqueda && matchFecha;

        async function guardarVendedorDueno(e) {
            e.preventDefault();
            const id = document.getElementById('vendedor-edit-id').value;
            const nombre = document.getElementById('vendedor-nombre').value.trim();
            const email = document.getElementById('vendedor-email').value.trim();
            const telefono = document.getElementById('vendedor-tel').value.trim();

            if (id) {
                await supabaseClient.from('vendedores_comercio').update({ nombre, email, telefono }).eq('id', id);
                alert('Vendedor actualizado con éxito');
            } else {
                await supabaseClient.from('vendedores_comercio').insert([{ comercio_email: usuarioActual.email, nombre, email, telefono, activo: true }]);
                alert('Vendedor registrado con éxito');
            }
            cancelarEdicionVendedor();
            cargarVendedoresDueno();
        }

        function prepararEdicionVendedor(id, nombre, email, telefono) {
            document.getElementById('vendedor-edit-id').value = id;
            document.getElementById('vendedor-nombre').value = nombre;
            document.getElementById('vendedor-email').value = email;
            document.getElementById('vendedor-tel').value = telefono;
            document.getElementById('titulo-form-vendedor').innerText = 'Modificar Vendedor';
            document.getElementById('btn-cancelar-edit').classList.remove('hidden');
        }

        function cancelarEdicionVendedor() {
            document.getElementById('vendedor-edit-id').value = '';
            document.getElementById('titulo-form-vendedor').innerText = 'Registrar Nuevo Vendedor';
            document.getElementById('btn-cancelar-edit').classList.add('hidden');
            const form = document.querySelector('#dueno-content-area form');
            if (form) form.reset();
        }

        async function toggleEstadoVendedor(id, nuevoEstado) {
            await supabaseClient.from('vendedores_comercio').update({ activo: nuevoEstado }).eq('id', id);
            cargarVendedoresDueno();
        }

        async function cargarEstadisticasDueno() {
            const { data: pedidos } = await supabaseClient.from('pedidos_marketplace').select('*').eq('comercio_email', usuarioActual.email);
            const { data: vendedores } = await supabaseClient.from('vendedores_comercio').select('*').eq('comercio_email', usuarioActual.email);

            if (!pedidos) return;

            let efectivas = pedidos.filter(p => p.estatus === 'Concretado').length;
            let proceso = pedidos.filter(p => p.estatus === 'Pendiente').length;
            let noConcretado = pedidos.filter(p => p.estatus === 'No Concretado').length;
            let ingresos = pedidos.filter(p => p.estatus === 'Concretado').reduce((acc, i) => acc + (i.total || 0), 0);

            document.getElementById('stat-efectivas').innerText = efectivas;
            document.getElementById('stat-proceso').innerText = proceso;
            document.getElementById('stat-noconcretado').innerText = noConcretado;
            document.getElementById('stat-ingresos').innerText = `$${ingresos.toFixed(2)}`;

            const detalleContainer = document.getElementById('estadisticas-vendedores-detalle');
            if (!vendedores || vendedores.length === 0) {
                detalleContainer.innerHTML = `<p class="text-slate-500">No hay vendedores registrados para calcular rendimiento.</p>`;
                return;
            }

            detalleContainer.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                            <th class="p-3">Vendedor</th>
                            <th class="p-3">Estatus</th>
                            <th class="p-3">Ventas Concretadas</th>
                            <th class="p-3">Ingresos Generados</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${vendedores.map(v => {
                            let ventasVendedor = pedidos.filter(p => p.vendedor_email === v.email && p.estatus === 'Concretado');
                            let totalDinero = ventasVendedor.reduce((acc, i) => acc + (i.total || 0), 0);
                            return `
                                <tr class="border-b border-slate-100">
                                    <td class="p-3 font-bold">${v.nombre} (${v.email})</td>
                                    <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full ${v.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${v.activo ? 'Activo' : 'Desconectado'}</span></td>
                                    <td class="p-3 font-semibold text-emerald-600">${ventasVendedor.length}</td>
                                    <td class="p-3 font-semibold text-indigo-600">$${totalDinero.toFixed(2)}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        // --- DESCARGAR PDF T&C ---
        function descargarPDFOrden(orden) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("COMPROBANTE OFICIAL DE TÉRMINOS Y CONDICIONES", 14, 20);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Número de Orden: ${orden.numero_orden}`, 14, 30);
            doc.text(`Fecha y Hora: ${new Date(orden.fecha_creacion).toLocaleString()}`, 14, 36);
            doc.text(`Comercio Afiliado: ${orden.comercio_email}`, 14, 42);
            doc.text(`Vendedor Asignado: ${orden.vendedor_email}`, 14, 48);

            doc.line(14, 53, 196, 53);

            doc.setFont("helvetica", "bold");
            doc.text("Datos del Cliente:", 14, 61);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre: ${orden.cliente_nombre}`, 14, 67);
            doc.text(`Teléfono: ${orden.cliente_telefono}`, 14, 73);

            doc.setFont("helvetica", "bold");
            doc.text("Productos Solicitados:", 14, 83);
            doc.setFont("helvetica", "normal");

            let y = 90;
            if (orden.productos && Array.isArray(orden.productos)) {
                orden.productos.forEach((p, index) => {
                    doc.text(`${index + 1}. ${p.nombre} (x${p.cantidad}) - Subtotal: $${p.precio * p.cantidad}`, 14, y);
                    y += 6;
                });
            }

            y += 4;
            doc.setFont("helvetica", "bold");
            doc.text(`Total del Pedido: $${orden.total}`, 14, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("Cláusula de Aceptación:", 14, y);
            y += 6;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            const textoTC = "El cliente declara haber leído y aceptado los Términos y Condiciones del Marketplace Multi-Comercio, liberando de responsabilidad a la plataforma por pagos directos con el comercio.";
            const splitText = doc.splitTextToSize(textoTC, 180);
            doc.text(splitText, 14, y);

            doc.save(`Comprobante_${orden.numero_orden}.pdf`);
        }
    </script>
