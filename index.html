<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Multi-Comercio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold cursor-pointer tracking-wide text-indigo-400" onclick="verTiendaPublica()">Marketplace Multi-Comercio</h1>
            <div class="flex items-center space-x-4">
                <button onclick="verCarrito()" class="relative bg-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-500 transition">
                    🛒 Carrito <span id="cart-count" class="bg-rose-500 text-xs px-1.5 py-0.5 rounded-full ml-1 font-bold">0</span>
                </button>
                <div id="auth-nav-container">
                    <button onclick="abrirModalAuth()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-indigo-500 transition shadow-sm">
                        Acceso Socios / Admin / Vendedores
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main id="main-content" class="container mx-auto px-4 py-6">
        <!-- Se inyecta dinámicamente -->
    </main>

    <!-- Modal de Autenticación -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative border border-slate-100">
            <button onclick="cerrarModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            <h2 class="text-xl font-bold mb-4 text-slate-900">Iniciar Sesión en el Sistema</h2>
            <form id="login-form" onsubmit="manejarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="ej. elio.ravelo19@gmail.com" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full mt-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-md shadow-indigo-100">Entrar al Panel</button>
            </form>
        </div>
    </div>

    <!-- Modal de Detalle de Orden -->
    <div id="modal-detalle-orden" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white text-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-lg relative border border-slate-200">
            <button onclick="cerrarModalDetalleOrden()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            <h3 id="modal-orden-titulo" class="text-xl font-bold mb-4 text-indigo-600">Detalles de la Orden</h3>
            <div id="modal-orden-contenido" class="space-y-3 text-sm max-h-[70vh] overflow-y-auto pr-2"></div>
            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                <button onclick="cerrarModalDetalleOrden()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-700 transition">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal CRM Dinámico para Usuarios / Vendedores -->
    <div id="modal-usuario-crm" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-2xl w-full max-w-lg relative border border-slate-700">
            <button onclick="cerrarModalUsuario()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-xl">&times;</button>
            <h3 id="modal-usuario-titulo" class="text-xl font-bold mb-4 text-indigo-400">Registrar Nuevo Usuario</h3>
            
            <form id="form-usuario-crm" onsubmit="guardarUsuarioModal(event)" class="space-y-4">
                <input type="hidden" id="usuario-edit-id">
                <div id="contenedor-rol-select">
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Rol del Usuario</label>
                    <select id="modal-rol" onchange="onCambioRolModal()" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Vendedor">Vendedor</option>
                        <option value="Dueño de Negocio">Dueño de Negocio</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Comercio Afiliado / Asignación</label>
                    <input type="text" id="modal-comercio" required placeholder="Ej. polar, negocio.01@gmail.com o Global" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nombre Completo</label>
                    <input type="text" id="modal-nombre" required placeholder="Ej. Antonio Molina" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="modal-email" required placeholder="Ej. antonio.01@gmail.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div id="grupo-telefono">
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Número de Teléfono / WhatsApp (Requerido para Vendedor)</label>
                    <input type="text" id="modal-telefono" placeholder="Ej. +584122349994" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="cerrarModalUsuario()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition shadow-md shadow-indigo-900/50">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Configuración y Lógica -->
    <script src="config.js"></script>
    <script>
        const supabaseClient = supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);

        let carrito = [];
        let usuarioActual = null;
        let datosSesionRol = null;
        let cacheCatalogoDueno = [];

        document.addEventListener('DOMContentLoaded', () => {
            verTiendaPublica();
            verificarSesionActiva();
        });

        async function verificarSesionActiva() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                usuarioActual = session.user;
                await determinarRolYDireccionar(usuarioActual.email);
            }
        }

        async function determinarRolYDireccionar(email) {
            const { data } = await supabaseClient.from('vendedores_comercio').select('*').eq('email', email).maybeSingle();
            
            if (data) {
                datosSesionRol = data;
            } else {
                if (email === 'elio.ravelo19@gmail.com') {
                    datosSesionRol = { rol: 'Administrador', comercio: 'Global', email: email };
                } else if (email.startsWith('negocio.')) {
                    datosSesionRol = { rol: 'Dueño de Negocio', comercio: email, email: email };
                } else {
                    datosSesionRol = { rol: 'Dueño de Negocio', comercio: 'polar', email: email };
                }
            }

            actualizarNavAuth();
            direccionarPanelSegunRol();
        }

        function actualizarNavAuth() {
            const container = document.getElementById('auth-nav-container');
            if (usuarioActual) {
                container.innerHTML = `
                    <span class="text-sm mr-2 font-medium text-slate-300">${usuarioActual.email} (${datosSesionRol.rol})</span>
                    <button onclick="cerrarSesion()" class="bg-rose-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-rose-500 transition shadow-sm">Salir</button>
                `;
            }
        }

        function abrirModalAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function cerrarModalAuth() { document.getElementById('auth-modal').classList.add('hidden'); }

        async function manejarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                usuarioActual = { email: email };
            } else {
                usuarioActual = data.user;
            }
            cerrarModalAuth();
            await determinarRolYDireccionar(usuarioActual.email);
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            usuarioActual = null;
            datosSesionRol = null;
            location.reload();
        }

        // --- TIENDA PÚBLICA ---
        function verTiendaPublica() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900">Catálogo General</h2>
                    <p class="text-slate-500 mt-2">Explora los productos de nuestros comercios afiliados</p>
                </div>
                <div id="productos-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <p class="text-center col-span-3 text-slate-400 py-8">Cargando productos...</p>
                </div>
            `;
            cargarProductosPublicos();
        }

        async function cargarProductosPublicos() {
            const { data, error } = await supabaseClient.from('productos_marketplace').select('*');
            const grid = document.getElementById('productos-grid');
            if (error || !data || data.length === 0) {
                grid.innerHTML = `<p class="text-center col-span-3 text-slate-500 bg-white p-8 rounded-xl shadow-sm border border-slate-100">No hay productos disponibles en este momento.</p>`;
                return;
            }
            grid.innerHTML = data.map(p => {
                const nombreProd = p.nombre || p.nombre_producto || p.titulo || 'Producto sin nombre';
                const descProd = p.descripcion || p.detalle || 'Sin descripción disponible';
                const comercioProd = p.comercio_email || p.dueno_email || p.duenio_email || 'polar';
                const precioProd = p.precio || p.costo || 0;
                const stockProd = p.stock !== undefined ? p.stock : (p.cantidad_stock || 0);
                const imagenProd = p.imagen || p.imagen_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3';

                const productoLimpio = {
                    id: p.id,
                    nombre: nombreProd,
                    precio: precioProd,
                    stock: stockProd,
                    comercio_email: comercioProd,
                    descripcion: descProd,
                    imagen: imagenProd
                };

                return `
                    <div class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="h-48 w-full overflow-hidden bg-slate-100 relative">
                                <img src="${imagenProd}" alt="${nombreProd}" class="w-full h-full object-cover">
                                <span class="absolute top-3 left-3 text-xs font-semibold px-2.5 py-1 bg-white/90 backdrop-blur-sm text-indigo-600 rounded-full shadow-sm">${comercioProd}</span>
                            </div>
                            <div class="p-5">
                                <h3 class="font-bold text-lg text-slate-900">${nombreProd}</h3>
                                <p class="text-slate-600 text-sm mt-1">${descProd}</p>
                                <p class="text-indigo-600 font-extrabold text-2xl mt-4">$${precioProd}</p>
                                <p class="text-xs text-slate-400 mt-1">Stock disponible: ${stockProd}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <button onclick='agregarAlCarrito(${JSON.stringify(productoLimpio)})' class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-sm">Agregar al Carrito</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function agregarAlCarrito(producto) {
            const existente = carrito.find(item => item.id === producto.id);
            if (existente) {
                if (existente.cantidad < producto.stock) {
                    existente.cantidad += 1;
                } else {
                    alert('No hay más stock disponible para este producto.');
                    return;
                }
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            document.getElementById('cart-count').innerText = carrito.reduce((acc, i) => acc + i.cantidad, 0);
            alert('Producto agregado al carrito');
        }

        function verCarrito() {
            const main = document.getElementById('main-content');
            if (carrito.length === 0) {
                main.innerHTML = `<div class="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100"><h2 class="text-2xl font-bold text-slate-700">Tu carrito está vacío</h2><button onclick="verTiendaPublica()" class="mt-4 bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition">Volver a la tienda</button></div>`;
                return;
            }
            main.innerHTML = `
                <h2 class="text-2xl font-bold mb-6 text-slate-900">Finalizar Pedido</h2>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-xl mx-auto space-y-4">
                    ${carrito.map(i => `<div class="flex justify-between border-b border-slate-100 py-3 text-sm"><span>${i.nombre} (x${i.cantidad})</span><span class="font-semibold">$${i.precio * i.cantidad}</span></div>`).join('')}
                    <div class="pt-4 space-y-4">
                        <input type="text" id="cliente-nombre" placeholder="Tu Nombre Completo" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <input type="text" id="cliente-telefono" placeholder="Número de Teléfono (ej. 04121234567)" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-1">
                            <p class="font-bold text-slate-700">Términos y Condiciones:</p>
                            <p>Al confirmar el pedido, usted acepta los términos de servicio y responsabilidad de pagos directos al comercio afiliado.</p>
                        </div>
                        <div class="flex items-center space-x-2 text-sm text-slate-700">
                            <input type="checkbox" id="terminos-check" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <label for="terminos-check">Acepto los Términos y Condiciones obligatorios.</label>
                        </div>
                        <button onclick="enviarPedidoMarketplace()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-sm">Confirmar y Enviar Pedido vía WhatsApp</button>
                    </div>
                </div>
            `;
        }

        async function enviarPedidoMarketplace() {
            const nombre = document.getElementById('cliente-nombre').value.trim();
            const telefono = document.getElementById('cliente-telefono').value.trim();
            const acepto = document.getElementById('terminos-check').checked;

            if (!nombre || !telefono) {
                alert('Por favor ingrese su nombre y número de teléfono.');
                return;
            }
            if (!acepto) {
                alert('Debe aceptar obligatoriamente los Términos y Condiciones para continuar.');
                return;
            }

            const comercioEmail = carrito[0].comercio_email || 'polar';
            
            const { data: vendedores } = await supabaseClient
                .from('vendedores_comercio')
                .select('*')
                .eq('comercio', comercioEmail)
                .eq('rol', 'Vendedor')
                .eq('activo', true);

            let vendedorAsignado = null;
            if (vendedores && vendedores.length > 0) {
                const indice = Math.floor(Math.random() * vendedores.length);
                vendedorAsignado = vendedores[indice];
            }

            const numeroOrden = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const totalPedido = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

            const datosPedido = {
                numero_orden: numeroOrden,
                comercio_email: comercioEmail,
                dueno_email: comercioEmail,
                duenio_email: comercioEmail,
                comercio: comercioEmail,
                cliente_nombre: nombre,
                cliente_telefono: telefono,
                vendedor_email: vendedorAsignado ? vendedorAsignado.email : 'Sin asignar',
                productos: carrito,
                total: totalPedido,
                estatus: 'Pendiente',
                terminos_aceptados: true,
                fecha_creacion: new Date().toISOString()
            };

            await supabaseClient.from('pedidos_marketplace').insert([datosPedido]);

            for (const item of carrito) {
                const { data: prodActual } = await supabaseClient.from('productos_marketplace').select('stock').eq('id', item.id).maybeSingle();
                const stockActual = prodActual && prodActual.stock !== undefined ? prodActual.stock : (item.stock || 0);
                const nuevoStock = Math.max(0, stockActual - item.cantidad);
                
                await supabaseClient
                    .from('productos_marketplace')
                    .update({ stock: nuevoStock })
                    .eq('id', item.id);
            }

            let textoMensaje = `Hola, te escribo para concretar mi orden N° ${numeroOrden}.`;

            carrito = [];
            document.getElementById('cart-count').innerText = 0;

            let telVendedor = vendedorAsignado && vendedorAsignado.telefono ? vendedorAsignado.telefono.replace(/\D/g, '') : '';
            if (telVendedor.startsWith('0')) {
                telVendedor = '58' + telVendedor.substring(1);
            }

            const mensajeWhatsApp = encodeURIComponent(textoMensaje);
            
            if (telVendedor) {
                window.location.href = `https://wa.me/${telVendedor}?text=${mensajeWhatsApp}`;
            } else {
                alert(`Pedido ${numeroOrden} registrado con éxito (Stock descontado). Sin vendedor activo para asignar automáticamente.`);
                verTiendaPublica();
            }
        }

        function direccionarPanelSegunRol() {
            if (datosSesionRol.rol === 'Administrador' || usuarioActual.email === 'elio.ravelo19@gmail.com') {
                renderizarPanelAdmin();
            } else {
                renderizarPanelDueno(datosSesionRol);
            }
        }

        // --- PANEL DE ADMINISTRADOR ---
        function renderizarPanelAdmin() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">Panel de Administrador Global</h2>
                    <p class="text-slate-500 text-sm">Control central del sistema</p>
                </div>
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-64 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col space-y-2 h-fit">
                        <h3 class="font-bold text-slate-900 text-sm uppercase px-2 tracking-wider text-slate-400 mb-1">Navegación</h3>
                        <button onclick="cambiarTabAdmin('panel')" id="btn-admin-panel" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm bg-indigo-600 text-white transition shadow-sm">Panel del Administrador</button>
                        <button onclick="cambiarTabAdmin('auditorias')" id="btn-admin-auditorias" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Auditorías</button>
                        <button onclick="cambiarTabAdmin('usuarios')" id="btn-admin-usuarios" class="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Seguridad y Usuarios</button>
                    </div>
                    <div class="flex-1" id="admin-content-area"></div>
                </div>
            `;
            cambiarTabAdmin('panel');
        }

        async function cargarComerciosSelectAdmin(selectId) {
            const select = document.getElementById(selectId);
            if (!select) return;

            let comerciosSet = new Set(['polar', 'negocio.01@gmail.com', 'negocio.02@gmail.com']);

            const { data } = await supabaseClient.from('vendedores_comercio').select('*');
            if (data) {
                data.forEach(v => {
                    const c = v.comercio || v.dueno_email || v.duenio_email || v.comercio_email;
                    if (c && c !== 'Global' && c !== 'N/A') comerciosSet.add(c);
                });
            }

            const opcionesHTML = Array.from(comerciosSet).map(c => `<option value="${c}">${c}</option>`).join('');
            
            if (selectId === 'adm-filtro-comercio') {
                select.innerHTML = `<option value="">Todos los Comercios</option>` + opcionesHTML;
            } else {
                select.innerHTML = opcionesHTML;
            }
        }

        function cambiarTabAdmin(tab) {
            ['panel', 'auditorias', 'usuarios'].forEach(t => {
                const btn = document.getElementById(`btn-admin-${t}`);
                if (btn) {
                    btn.className = t === tab ? 
                        'w-full text-left px-4 py-3 rounded-xl font-semibold text-sm bg-indigo-600 text-white transition shadow-sm' : 
                        'w-full text-left px-4 py-3 rounded-xl font-semibold text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
                }
            });

            const area = document.getElementById('admin-content-area');
            if (tab === 'panel') {
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-xl">
                            <h3 class="font-bold text-lg mb-4 text-indigo-600">Cargar Producto al Comercio</h3>
                            <form onsubmit="adminGuardarProducto(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Comercio Destino</label>
                                    <select id="adm-comercio" required class="w-full mt-1 border border-slate-300 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                        <option value="">Cargando comercios...</option>
                                    </select>
                                </div>
                                <div>

        // --- GUARDAR PRODUCTO CORREGIDO (SIN COLUMNA COMERCIO INEXISTENTE) ---
        function adminGuardarProducto(e) {
            e.preventDefault();
            let comercio_email = document.getElementById('adm-comercio')?.value || 'polar';
            const nombre = document.getElementById('adm-nombre').value;
            const precio = parseFloat(document.getElementById('adm-precio').value);
            const stock = parseInt(document.getElementById('adm-stock').value);
            const descripcion = document.getElementById('adm-desc').value;
            const fileInput = document.getElementById('adm-imagen-file');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    const imagenBase64 = uploadEvent.target.result;
                    
                    const payloadProducto = {
                        comercio_email: comercio_email,
                        dueno_email: comercio_email,
                        duenio_email: comercio_email,
                        nombre: nombre,
                        nombre_producto: nombre,
                        precio: precio,
                        stock: stock,
                        imagen: imagenBase64,
                        imagen_url: imagenBase64,
                        descripcion: descripcion
                    };

                    const { error } = await supabaseClient.from('productos_marketplace').insert([payloadProducto]);
                    if (error) {
                        alert('Error al guardar: ' + error.message);
                    } else {
                        alert('¡Producto guardado correctamente con su imagen!');
                        e.target.reset();
                        cargarProductosAdminGlobal();
                    }
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert('Por favor selecciona una imagen.');
            }
        }

        async function cargarAuditoriaAdmin() {
            const busqueda = document.getElementById('adm-search')?.value.toLowerCase() || '';

            const fechaFiltro = document.getElementById('adm-filtro-fecha')?.value || '';

            let query = supabaseClient.from('pedidos_marketplace').select('*').order('fecha_creacion', { ascending: false });
            if (comercioFiltro) query = query.eq('comercio_email', comercioFiltro);

            const { data } = await query;
            const container = document.getElementById('adm-tabla-auditoria');
            if (!container) return;

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-slate-500">No hay órdenes registradas.</p>`;
                return;
            }

            let filtrados = data.filter(o => {
                let matchBusqueda = !busqueda || o.numero_orden.toLowerCase().includes(busqueda) || o.cliente_telefono.toLowerCase().includes(busqueda) || o.cliente_nombre.toLowerCase().includes(busqueda);
                let matchFecha = !fechaFiltro || (o.fecha_creacion && o.fecha_creacion.startsWith(fechaFiltro));
                return matchBusqueda && matchFecha;
            });

            if (filtrados.length === 0) {

                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function cargarVendedoresPanelDueno() {

            const misVendedores = data ? data.filter(v => {

            if (misVendedores.length === 0) {
                container.innerHTML = `<p class="text-slate-500 py-4">No tienes vendedores registrados todavía. Haz clic en "+ Nuevo Vendedor" para agregar uno.</p>`;

                                    <button onclick="abrirModalEditarUsuario('${v.id}', '${v.nombre}', '${v.email}', '${v.telefono}', '${v.comercio}', '${v.rol || 'Vendedor'}')" class="text-amber-600 hover:underline font-semibold text-xs">Modificar</button>

        async function toggleEstadoVendedorDueno(id, nuevoEstado) {
            const { error } = await supabaseClient.from('vendedores_comercio').update({ activo: nuevoEstado }).eq('id', id);
            if (error) {
                alert('Error al actualizar estatus: ' + error.message);
            } else {
                cargarVendedoresPanelDueno();
            }
        }

        async function cargarCatalogoDueno() {
            const comercioId = (datosSesionRol.comercio || datosSesionRol.email || 'polar').toLowerCase().trim();
            const { data } = await supabaseClient.from('productos_marketplace').select('*');
            const container = document.getElementById('catalogo-stock-container');
            if (!container) return;
            
            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-slate-500">No hay productos en tu inventario.</p>`;
                cacheCatalogoDueno = [];
                return;
            }

            cacheCatalogoDueno = data.filter(p => {
                const cEmail = (p.comercio_email || '').toLowerCase().trim();
                const dEmail = (p.dueno_email || '').toLowerCase().trim();
                const dnEmail = (p.duenio_email || '').toLowerCase().trim();
                
                return cEmail === comercioId || dEmail === comercioId || dnEmail === comercioId || cEmail.includes('polar') || comercioId.includes('polar');
            });

            renderizarListaCatalogoDueno(cacheCatalogoDueno);
        }

        function filtrarCatalogoDueno() {
            const busqueda = document.getElementById('catalogo-search')?.value.toLowerCase().trim() || '';
            const filtrados = cacheCatalogoDueno.filter(p => {
                const nombreProd = (p.nombre || p.nombre_producto || p.titulo || '').toLowerCase();
                const descProd = (p.descripcion || '').toLowerCase();
                return nombreProd.includes(busqueda) || descProd.includes(busqueda);
            });
            renderizarListaCatalogoDueno(filtrados);
        }

        function renderizarListaCatalogoDueno(productos) {
            const container = document.getElementById('catalogo-stock-container');
            if (!container) return;

            if (productos.length === 0) {
                container.innerHTML = `<p class="text-slate-500 py-4">No se encontraron productos con ese criterio.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="space-y-3">
                    ${productos.map(p => {
                        const nombreProd = p.nombre || p.nombre_producto || p.titulo || 'Producto';
                        const precioProd = p.precio || p.costo || 0;
                        const stockProd = p.stock !== undefined ? p.stock : 0;
                        const imagenProd = p.imagen || p.imagen_url || '';
                        return `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border border-slate-100 bg-slate-50/50 p-4 rounded-xl gap-4">
                                <div class="flex items-center space-x-3">
                                    ${imagenProd ? `<img src="${imagenProd}" class="w-12 h-12 rounded-lg object-cover border border-slate-200">` : ''}
                                    <div>
                                        <h4 class="font-bold text-slate-900">${nombreProd}</h4>
                                        <p class="text-xs text-slate-500">Precio: $${precioProd} | Stock actual: <span class="font-bold text-indigo-600">${stockProd}</span></p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-3 w-full sm:w-auto">
                                    <div class="flex items-center space-x-2">
                                        <input type="number" id="input-stock-${p.id}" value="${stockProd}" class="w-20 border border-slate-300 p-1.5 rounded-lg text-sm bg-white">
                                        <button onclick="actualizarStockDueno('${p.id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm">Guardar Stock</button>
                                    </div>
                                    <button onclick="eliminarProductoDueno('${p.id}')" class="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm hover:bg-rose-700 transition">Eliminar</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function actualizarStockDueno(id) {
            const nuevoStock = parseInt(document.getElementById(`input-stock-${id}`).value);
            await supabaseClient.from('productos_marketplace').update({ stock: nuevoStock }).eq('id', id);
            alert('Stock actualizado con éxito');
            cargarCatalogoDueno();
        }

        async function eliminarProductoDueno(id) {
            if (confirm('¿Estás seguro de eliminar este producto de tu catálogo?')) {
                const { error } = await supabaseClient.from('productos_marketplace').delete().eq('id', id);
                if (error) {
                    alert('Error al eliminar el producto: ' + error.message);
                } else {
                    alert('Producto eliminado con éxito.');
                    cargarCatalogoDueno();
                }
            }
        }

        let filtroVentasActual = 'todas';
        function filtrarVentasDueno(tipo) {
            filtroVentasActual = tipo;
            ['todas', 'abiertas', 'cerradas'].forEach(t => {
                const btn = document.getElementById(`btn-filtro-${t}`);
                if (btn) {
                    btn.className = (t === (tipo === 'Pendiente' ? 'abiertas' : tipo === 'Cerradas' ? 'cerradas' : 'todas')) ?
                        'px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold' :
                        'px-3 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-200';
                }
            });
            cargarEstadisticasDueno();
        }

        async function cargarEstadisticasDueno() {
            const comercioId = (datosSesionRol.comercio || datosSesionRol.email || 'polar').toLowerCase().trim();
            const { data: todosLosPedidos } = await supabaseClient.from('pedidos_marketplace').select('*').order('fecha_creacion', { ascending: false });
            
            if (!todosLosPedidos) return;

            const pedidos = todosLosPedidos.filter(p => {
                const cEmail = (p.comercio_email || '').toLowerCase().trim();
                const dEmail = (p.dueno_email || '').toLowerCase().trim();
                const dnEmail = (p.duenio_email || '').toLowerCase().trim();
                return cEmail === comercioId || dEmail === comercioId || dnEmail === comercioId || cEmail.includes('polar') || comercioId.includes('polar');
            });

            let ventasTotalesCerradas = pedidos.filter(p => p.estatus === 'Concretado').length;
            let ingresosTotales = pedidos.filter(p => p.estatus === 'Concretado').reduce((acc, i) => acc + (i.total || 0), 0);
            let ventasAbiertas = pedidos.filter(p => p.estatus === 'Pendiente').length;
            let ventasCerradas = pedidos.filter(p => p.estatus === 'Concretado' || p.estatus === 'No Concretado').length;

            const statTotalesEl = document.getElementById('stat-totales');
            const statIngresosEl = document.getElementById('stat-ingresos');
            const statAbiertasEl = document.getElementById('stat-abiertas');
            const statCerradasEl = document.getElementById('stat-cerradas');

            if (statTotalesEl) statTotalesEl.innerText = ventasTotalesCerradas;
            if (statIngresosEl) statIngresosEl.innerText = `$${ingresosTotales.toFixed(2)}`;
            if (statAbiertasEl) statAbiertasEl.innerText = ventasAbiertas;
            if (statCerradasEl) statCerradasEl.innerText = ventasCerradas;

            const ordenesSinAsignar = pedidos.filter(p => !p.vendedor_email || p.vendedor_email === 'Sin asignar');
            const alertaBox = document.getElementById('alerta-ordenes-pendientes');
            const tablaPendientes = document.getElementById('tabla-ordenes-pendientes-asignar');
            
            if (ordenesSinAsignar.length > 0 && alertaBox && tablaPendientes) {
                alertaBox.classList.remove('hidden');
                tablaPendientes.innerHTML = `
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-amber-200 bg-amber-100/50">
                                <th class="p-2">N° Orden</th>
                                <th class="p-2">Cliente</th>
                                <th class="p-2">Teléfono</th>
                                <th class="p-2">Total</th>
                                <th class="p-2">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ordenesSinAsignar.map(o => `
                                <tr class="border-b border-amber-200">
                                    <td class="p-2 font-bold"><button onclick='verDetalleOrdenModal(${JSON.stringify(o)})' class="text-indigo-600 hover:underline">${o.numero_orden}</button></td>
                                    <td class="p-2">${o.cliente_nombre}</td>
                                    <td class="p-2">${o.cliente_telefono}</td>
                                    <td class="p-2 font-semibold">$${o.total}</td>
                                    <td class="p-2"><button onclick="asignarVendedorOrdenModal('${o.id}')" class="bg-indigo-600 text-white px-2 py-1 rounded text-xs font-semibold">Asignar Vendedor</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else if (alertaBox) {
                alertaBox.classList.add('hidden');
            }

            const busqueda = document.getElementById('dueno-search')?.value.toLowerCase() || '';
            const fechaFiltro = document.getElementById('dueno-fecha')?.value || '';
            const container = document.getElementById('lista-ordenes-estadisticas');
            if (!container) return;

            let filtradas = pedidos.filter(o => {
                let matchFiltro = true;
                if (filtroVentasActual === 'Pendiente') matchFiltro = (o.estatus === 'Pendiente');
                if (filtroVentasActual === 'Cerradas') matchFiltro = (o.estatus === 'Concretado' || o.estatus === 'No Concretado');

                let matchBusqueda = !busqueda || o.numero_orden.toLowerCase().includes(busqueda) || o.cliente_telefono.toLowerCase().includes(busqueda) || o.cliente_nombre.toLowerCase().includes(busqueda);
                let matchFecha = !fechaFiltro || (o.fecha_creacion && o.fecha_creacion.startsWith(fechaFiltro));
                return matchFiltro && matchBusqueda && matchFecha;
            });

            if (filtradas.length === 0) {
                container.innerHTML = `<p class="text-slate-500 py-4">No hay órdenes que coincidan con el filtro seleccionado.</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                            <th class="p-3">N° Orden</th>
                            <th class="p-3">Fecha y Hora</th>
                            <th class="p-3">Cliente / Teléfono</th>
                            <th class="p-3">Vendedor</th>
                            <th class="p-3">Total</th>
                            <th class="p-3">Estatus</th>
                            <th class="p-3">Acciones / T&C</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtradas.map(o => `
                            <tr class="border-b border-slate-100">
                                <td class="p-3 font-bold"><button onclick='verDetalleOrdenModal(${JSON.stringify(o)})' class="text-indigo-600 hover:underline">${o.numero_orden}</button></td>
                                <td class="p-3 text-xs text-slate-500">${new Date(o.fecha_creacion).toLocaleString()}</td>
                                <td class="p-3">${o.cliente_nombre}<br><span class="text-xs text-slate-500">${o.cliente_telefono}</span></td>
                                <td class="p-3 text-indigo-600 font-medium">${o.vendedor_email}</td>
                                <td class="p-3 font-semibold">$${o.total}</td>
                                <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full ${o.estatus === 'Concretado' ? 'bg-emerald-100 text-emerald-800' : o.estatus === 'No Concretado' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}">${o.estatus}</span></td>
                                <td class="p-3 space-x-1">
                                    <button onclick="cambiarEstatusOrden('${o.id}', 'Concretado')" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs font-semibold">Concretar</button>
                                    <button onclick="cambiarEstatusOrden('${o.id}', 'No Concretado')" class="bg-rose-600 text-white px-2.5 py-1 rounded text-xs font-semibold">Cerrar/No</button>
                                    <button onclick='descargarPDFOrden(${JSON.stringify(o)})' class="bg-indigo-600 text-white px-2.5 py-1 rounded text-xs font-semibold">PDF T&C</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function verDetalleOrdenModal(orden) {

            const contenido = document.getElementById('modal-orden-contenido');

                            <p class="text-xs text-slate-500">Cantidad: ${p.cantidad} | Precio Unitario: $${p.precio}</p>
                        </div>

                    </div>
                `).join('');
            } else {
                productosHtml = `<p class="text-slate-500">No hay información de productos en esta orden.</p>`;

                <div class="space-y-3">
                    <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-xs space-y-1">

                        <p><strong>Fecha y Hora:</strong> ${new Date(orden.fecha_creacion).toLocaleString()}</p>
                        <p><strong>Comercio Afiliado:</strong> ${orden.comercio_email}</p>
                        <p><strong>Vendedor Asignado:</strong> ${orden.vendedor_email}</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 mb-1">Datos del Cliente</h4>
                        <p class="text-xs text-slate-600"><strong>Nombre:</strong> ${orden.cliente_nombre}</p>
                        <p class="text-xs text-slate-600"><strong>Teléfono:</strong> ${orden.cliente_telefono}</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 mb-2">Productos Solicitados</h4>
                        <div class="space-y-2">${productosHtml}</div>
                    </div>
                    <div class="pt-3 border-t border-slate-200 flex justify-between items-center">
                        <span class="font-bold text-slate-900">Total del Pedido:</span>
                        <span class="text-xl font-extrabold text-emerald-600">$${orden.total}</span>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function cerrarModalDetalleOrden() {
            document.getElementById('modal-detalle-orden').classList.add('hidden');
        }

        async function asignarVendedorOrdenModal(idOrden) {
            const comercioId = datosSesionRol.comercio || datosSesionRol.email || 'polar';
            const { data: vendedores } = await supabaseClient.from('vendedores_comercio').select('*').eq('comercio', comercioId).eq('rol', 'Vendedor').eq('activo', true);
            if (!vendedores || vendedores.length === 0) {
                alert('No tienes vendedores activos para asignar. Por favor activa un vendedor primero.');
                return;
            }
            let listaStr = vendedores.map((v, i) => `${i + 1}. ${v.nombre} (${v.email})`).join('\n');
            let seleccion = prompt(`Selecciona el número de vendedor a asignar:\n${listaStr}`);
            if (seleccion) {
                let index = parseInt(seleccion) - 1;
                if (vendedores[index]) {
                    let vendedorElegido = vendedores[index].email;
                    await supabaseClient.from('pedidos_marketplace').update({ vendedor_email: vendedorElegido }).eq('id', idOrden);
                    alert('¡Vendedor asignado con éxito!');
                    cargarEstadisticasDueno();
                } else {
                    alert('Selección inválida.');
                }
            }
        }

        async function cambiarEstatusOrden(idOrden, nuevoEstatus) {
            await supabaseClient.from('pedidos_marketplace').update({ estatus: nuevoEstatus }).eq('id', idOrden);
            alert(`Orden marcada como ${nuevoEstatus}`);
            if (datosSesionRol && datosSesionRol.rol === 'Dueño de Negocio') {
                cargarEstadisticasDueno();
            } else if (usuarioActual) {
                direccionarPanelSegunRol();
            }
        }

        function descargarPDFOrden(orden) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("COMPROBANTE OFICIAL DE TÉRMINOS Y CONDICIONES", 14, 20);

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Número de Orden: ${orden.numero_orden}`, 14, 30);
            doc.text(`Fecha y Hora: ${new Date(orden.fecha_creacion).toLocaleString()}`, 14, 36);
            doc.text(`Comercio Afiliado: ${orden.comercio_email}`, 14, 42);
            doc.text(`Vendedor Asignado: ${orden.vendedor_email}`, 14, 48);

            doc.line(14, 53, 196, 53);

            doc.setFont("helvetica", "bold");
            doc.text("Datos del Cliente:", 14, 61);
            doc.setFont("helvetica", "normal");
            doc.text(`Nombre: ${orden.cliente_nombre}`, 14, 67);
            doc.text(`Teléfono: ${orden.cliente_telefono}`, 14, 73);

            doc.setFont("helvetica", "bold");
            doc.text("Productos Solicitados:", 14, 83);
            doc.setFont("helvetica", "normal");

            let y = 90;
            if (orden.productos && Array.isArray(orden.productos)) {
                orden.productos.forEach((p, index) => {
                    doc.text(`${index + 1}. ${p.nombre} (x${p.cantidad}) - Subtotal: $${p.precio * p.cantidad}`, 14, y);
                    y += 6;
                });
            }

            y += 4;
            doc.setFont("helvetica", "bold");
            doc.text(`Total del Pedido: $${orden.total}`, 14, y);

            y += 15;
            doc.setFont("helvetica", "bold");
            doc.text("Cláusula de Aceptación:", 14, y);
            y += 6;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            const textoTC = "El cliente declara haber leído y aceptado los Términos y Condiciones del Marketplace Multi-Comercio, liberando de responsabilidad a la plataforma por pagos directos con el comercio.";
            const splitText = doc.splitTextToSize(textoTC, 180);
            doc.text(splitText, 14, y);

            doc.save(`Comprobante_${orden.numero_orden}.pdf`);
        }
    </script>
</body>
</html>
